[project]
name = "storm-shield-node"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "rns>=1.5.7",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "gpiozero"]
# What the Pi installs to read the Breadboard (dev has gpiozero too, for the tests' mock pins).
# lgpio is the pin backend; it builds from source, so pi/install.sh installs its system libraries.
pi = ["gpiozero", "lgpio; sys_platform == 'linux'"]

# lgpio ships only as source, and reading its metadata would build it (needs swig). Declaring it
# here lets `uv lock` run on a laptop; the build still happens on the Pi.
[tool.uv]
dependency-metadata = [{ name = "lgpio", version = "0.2.2.0", requires-dist = [] }]

[project.scripts]
storm-shield-node = "storm_shield.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_shield"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The Cache Pack build script is not part of the Node, but its routing is tested here.
pythonpath = ["../scripts"]
# Real Reticulum Nodes on fixed ports. Left out by default (and in CI); run them with
# `uv run pytest -m mesh_integration` or the "Mesh integration" workflow.
markers = ["mesh_integration: starts real Node processes over Reticulum"]
addopts = '-m "not mesh_integration"'

[tool.mypy]
strict = true
mypy_path = "../scripts"

[[tool.mypy.overrides]]
module = ["RNS", "RNS.*", "gpiozero", "gpiozero.*", "imageio_ffmpeg"]
ignore_missing_imports = true

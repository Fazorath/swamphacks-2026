[project]
name = "storm-shield-node"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "rns>=1.5.7",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
storm-shield-node = "storm_shield.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_shield"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["RNS", "RNS.*"]
ignore_missing_imports = true

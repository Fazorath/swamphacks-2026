[project]
name = "storm-shield-node"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "rns>=1.5.7",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "gpiozero"]
# Only the Pi reads the Breadboard; pi/README.md covers the lgpio backend it also needs.
pi = ["gpiozero"]

[project.scripts]
storm-shield-node = "storm_shield.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_shield"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The Cache Pack build script is not part of the Node, but its routing is tested here.
pythonpath = ["../scripts"]

[tool.mypy]
strict = true
mypy_path = "../scripts"

[[tool.mypy.overrides]]
module = ["RNS", "RNS.*", "gpiozero", "gpiozero.*"]
ignore_missing_imports = true

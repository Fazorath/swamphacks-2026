# Keeps the issue labels, roadmap milestones and the hackathon release in step with
# scripts/github-labels.sh.
name: GitHub setup

on:
  push:
    branches: [main]
    paths: [scripts/github-labels.sh]
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  labels:
    name: Labels and milestones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/github-labels.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

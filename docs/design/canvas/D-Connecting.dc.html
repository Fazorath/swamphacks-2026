<body>
<x-dc>
<helmet>

<div class="ss" style="zoom: 1.2; height: calc(100vh / 1.2); min-height: 750px; display: flex; flex-direction: column; overflow: hidden">

<button class="ss-btn ss-btn--ghost ss-btn--sm" aria-pressed="false"><svg class="ss-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3"></path> <path d="M12 19H3"></path> <path d="M14 3v4"></path> <path d="M16 17v4"></path> <path d="M21 12h-9"></path> <path d="M21 19h-5"></path> <path d="M21 5h-7"></path> <path d="M8 10v4"></path> <path d="M8 12H3"></path></svg>Node</button>

</div>
</header>

<main aria-label="Connecting" style="position: relative; flex: 1; min-height: 0; overflow: hidden">
<div style="position: absolute; inset: 0"><svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block" role="img" aria-label="Neighborhood map">
<defs>
<pattern id="m32-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" style="fill: var(--flood-prone); fill-opacity: 0.08"></rect><path d="M0 0V10" style="stroke: var(--flood-prone); stroke-width: 2; stroke-opacity: 0.45"></path></pattern>
<radialGradient id="m32-storm" cx="50%" cy="50%" r="75%"><stop offset="55%" style="stop-color: var(--ink-black); stop-opacity: 0"></stop><stop offset="100%" style="stop-color: var(--ink-black); stop-opacity: 0.7"></stop></radialGradient>
</defs>
<rect width="1200" height="700" style="fill: var(--map-ground)"></rect>


</svg></div>
<div style="position: absolute; left: 12px; top: 12px; z-index: 1"><nav class="ss-panel ss-rail" aria-label="Layer rail">
<button class="ss-rail-btn" aria-label="Nodes" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"></path> <path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"></path> <circle cx="12" cy="9" r="2"></circle> <path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"></path> <path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"></path> <path d="M9.5 18h5"></path> <path d="m8 22 4-11 4 11"></path></svg></button>

<button class="ss-rail-btn" aria-label="Flood-Prone Areas" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"></path> <path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"></path> <path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"></path></svg></button>
<button class="ss-rail-btn" aria-label="Shelters" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h4"></path> <path d="M10 8h4"></path> <path d="M14 21v-3a2 2 0 0 0-4 0v3"></path> <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"></path> <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path></svg></button>
<button class="ss-rail-btn" aria-label="Route" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle> <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path> <circle cx="18" cy="5" r="3"></circle></svg></button>
<button class="ss-rail-btn" aria-label="Storm Signal" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"></path> <path d="m13 12-3 5h4l-3 5"></path></svg></button>
<hr>
<button class="ss-rail-btn" aria-label="Cameras" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.75 12h3.632a1 1 0 0 1 .894 1.447l-2.034 4.069a1 1 0 0 1-1.708.134l-2.124-2.97"></path> <path d="M17.106 9.053a1 1 0 0 1 .447 1.341l-3.106 6.211a1 1 0 0 1-1.342.447L3.61 12.3a2.92 2.92 0 0 1-1.3-3.91L3.69 5.6a2.92 2.92 0 0 1 3.92-1.3z"></path> <path d="M2 19h3.76a2 2 0 0 0 1.8-1.1L9 15"></path> <path d="M2 21v-4"></path> <path d="M7 9h.01"></path></svg></button>
<button class="ss-rail-btn" aria-label="Alerts" aria-pressed="false" disabled><svg class="ss-i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path> <path d="M12 9v4"></path> <path d="M12 17h.01"></path></svg></button>
</nav></div>
<div style="position: absolute; left: 80px; top: 12px; bottom: 12px; width: 288px; display: flex; flex-direction: column; gap: 12px; z-index: 1"><div class="ss-panel" aria-label="Readings loading" style="padding: 14px; gap: 10px"><span class="ss-skel" style="height: 14px; width: 60%"></span><span class="ss-skel" style="height: 104px"></span><span class="ss-skel" style="height: 104px"></span><span class="ss-skel" style="height: 104px"></span></div></div>


<div role="status" style="position: absolute; left: 50%; top: 45%; transform: translate(-30%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><svg class="ss-i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent)"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"></path> <path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"></path> <circle cx="12" cy="9" r="2"></circle> <path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"></path> <path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"></path> <path d="M9.5 18h5"></path> <path d="m8 22 4-11 4 11"></path></svg><strong style="font-size: 18px">Connecting to garage…</strong><span style="font-size: 14px; color: var(--text-secondary); max-width: 320px; line-height: 1.45">Storm Shield runs on this neighborhood's Nodes. No internet needed.</span></div>
</main>
<footer class="ss-strip" aria-label="Freshness"><span>Waiting for the first snapshot</span></footer>
</div>
